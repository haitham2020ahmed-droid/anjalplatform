# Local development stack: MySQL 8 with utf8mb4 (Arabic names, curly quotes, IPA in word lists).
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: alanjal_ela
      MYSQL_USER: ela_app
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:?set MYSQL_APP_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci", "--sql-mode=STRICT_ALL_TABLES"]
    ports: ["3306:3306"]
    volumes: ["mysql-data:/var/lib/mysql"]
volumes:
  mysql-data:
